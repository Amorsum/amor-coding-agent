[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amor-coding-agent"
version = "1.0.0"
description = "A verifiable, observable, and safe local coding-agent foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amorsum" }]
keywords = ["coding-agent", "ai-agent", "verification", "sandbox", "worktree"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
amor = "amor.cli:main"

[project.urls]
Homepage = "https://github.com/Amorsum/amor-coding-agent"
Repository = "https://github.com/Amorsum/amor-coding-agent"
Issues = "https://github.com/Amorsum/amor-coding-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
